<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#ffffff" />
    <title>KITA-LOG</title>

    <style>
      /* ✅ Original KITA-LOG fonts loaded from /assets/fonts/ */
      @font-face {
        font-family: 'Inter-Light';
        src: url('/assets/fonts/Inter_300Light.ttf') format('truetype');
        font-weight: 300;
        font-display: swap;
      }
      @font-face {
        font-family: 'Inter-Regular';
        src: url('/assets/fonts/Inter_400Regular.ttf') format('truetype');
        font-weight: 400;
        font-display: swap;
      }
      @font-face {
        font-family: 'Inter-Medium';
        src: url('/assets/fonts/Inter_500Medium.ttf') format('truetype');
        font-weight: 500;
        font-display: swap;
      }
      @font-face {
        font-family: 'Inter-SemiBold';
        src: url('/assets/fonts/Inter_600SemiBold.ttf') format('truetype');
        font-weight: 600;
        font-display: swap;
      }
      @font-face {
        font-family: 'Inter-Bold';
        src: url('/assets/fonts/Inter_700Bold.ttf') format('truetype');
        font-weight: 700;
        font-display: swap;
      }
      @font-face {
        font-family: 'SpaceGrotesk-Regular';
        src: url('/assets/fonts/SpaceGrotesk_400Regular.ttf') format('truetype');
        font-weight: 400;
        font-display: swap;
      }
      @font-face {
        font-family: 'SpaceGrotesk-Bold';
        src: url('/assets/fonts/SpaceGrotesk_700Bold.ttf') format('truetype');
        font-weight: 700;
        font-display: swap;
      }
      @font-face {
        font-family: 'Ionicons';
        src: url('/assets/fonts/Ionicons.ttf') format('truetype');
        font-weight: normal;
        font-style: normal;
        font-display: block;
      }

      html, body {
        margin: 0;
        padding: 0;
        background-color: #F8FAFC;
      }
      #root {
        max-width: 480px;
        margin: 0 auto;
        min-height: 100vh;
        background-color: #F8FAFC;
        box-shadow: 0 0 20px rgba(0,0,0,0.05);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
